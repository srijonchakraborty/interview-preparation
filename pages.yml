name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate content
        run: |
          python3 - <<'PY'
          import json, os, sys
          topics = json.load(open("content/index.json"))["topics"]
          bad = [t["file"] for t in topics if not os.path.exists(t["file"])]
          if bad:
              sys.exit("Missing content files: " + ", ".join(bad))
          for t in topics:
              n = sum(1 for l in open(t["file"], encoding="utf-8") if l.startswith("### "))
              print(f'{t["id"]}: {n} cards')
          PY

      - name: Build site folder
        run: |
          mkdir _site
          cp index.html 404.html .nojekyll _site/
          rsync -a --exclude '_inbox' content _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
