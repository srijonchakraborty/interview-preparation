<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview Flashcards</title>
  <meta name="description" content="Flashcards for technical interviews. Progress stays in this browser.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c1915;
      --muted: #5c564c;
      --card: #fffdf8;
      --line: #ddd4c4;
      --accent: #0c5c4c;
      --accent-ink: #f4fffb;
      --review: #9a3412;
      --shadow: 0 16px 40px rgba(28, 25, 21, 0.08);
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --bg: #141210;
      --ink: #f3efe6;
      --muted: #b7ad9f;
      --card: #221f1b;
      --line: #3c362e;
      --accent: #8ddec8;
      --accent-ink: #10241e;
      --review: #fdba74;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg: #141210;
        --ink: #f3efe6;
        --muted: #b7ad9f;
        --card: #221f1b;
        --line: #3c362e;
        --accent: #8ddec8;
        --accent-ink: #10241e;
        --review: #fdba74;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 18px/1.5 "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    a { color: var(--accent); }
    button, .chip {
      font: inherit;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      cursor: pointer;
    }
    button:hover, .topic:hover { border-color: var(--accent); }
    button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    button:focus-visible, .topic:focus-visible, .card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    header, main { width: min(920px, calc(100% - 2rem)); margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; align-items: end; padding: 1.5rem 0 0.5rem; }
    header h1 { font-size: 1.6rem; margin: 0; font-weight: 650; }
    header p { margin: 0; color: var(--muted); flex: 1 1 16rem; }
    .tools { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .topic-list { list-style: none; padding: 0; margin: 1rem 0 2rem; display: grid; gap: 0.75rem; }
    .topic {
      width: 100%;
      text-align: left;
      border-radius: 16px;
      padding: 1rem 1.1rem;
      display: grid;
      gap: 0.2rem;
    }
    .topic strong { font-size: 1.15rem; }
    .meta { color: var(--muted); font-size: 0.95rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.8rem 0; }
    .filters span { align-self: center; color: var(--muted); font-size: 0.85rem; margin-right: 0.2rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      min-height: 16rem;
      padding: 1.25rem 1.35rem 1.4rem;
      cursor: pointer;
    }
    .card h2 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 0.8rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.8rem; }
    .badge { font-size: 0.78rem; letter-spacing: 0.02em; border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.5rem; color: var(--muted); }
    .badge.warn { color: var(--review); border-color: var(--review); }
    .card p { margin: 0.6rem 0; }
    .card ul { margin: 0.4rem 0; padding-left: 1.2rem; }
    .card pre {
      overflow: auto;
      padding: 0.8rem;
      background: var(--bg);
      border-radius: 10px;
      font-size: 0.86rem;
    }
    .card code { font-family: Consolas, ui-monospace, monospace; font-size: 0.9em; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.9rem 0 1.5rem; }
    .actions .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .banner, .empty { border: 1px solid var(--line); border-radius: 16px; padding: 1rem; background: var(--card); }
    .keys { color: var(--muted); font-size: 0.9rem; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1><a id="home-link" href="#/">Interview Flashcards</a></h1>
    </div>
    <p>Study one version at a time. Known and review marks stay in this browser.</p>
    <div class="tools">
      <button type="button" id="theme">Theme</button>
      <button type="button" id="export">Export progress</button>
      <button type="button" id="import">Import</button>
      <input id="import-file" type="file" accept="application/json" hidden>
    </div>
  </header>
  <main id="app"></main>
  <script>
    const STORAGE_KEY = "interview-prep.v1";
    const app = document.querySelector("#app");
    let catalog = [];
    let decks = new Map();
    let state = loadState();
    let study = null;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderInline(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderProse(text) {
      return text.trim().split(/\n\n+/).map((block) => {
        const lines = block.split("\n");
        if (lines.every((line) => line.startsWith("- "))) {
          return "<ul>" + lines.map((line) => "<li>" + renderInline(line.slice(2)) + "</li>").join("") + "</ul>";
        }
        return "<p>" + lines.map(renderInline).join("<br>") + "</p>";
      }).join("");
    }

    function renderBlocks(text) {
      return text.split("```").map((piece, index) => {
        if (index % 2 === 1) {
          const breakAt = piece.indexOf("\n");
          const code = breakAt === -1 ? piece : piece.slice(breakAt + 1);
          return "<pre><code>" + escapeHtml(code.replace(/\n$/, "")) + "</code></pre>";
        }
        return piece.trim() ? renderProse(piece) : "";
      }).join("");
    }

    function parseCards(text) {
      const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      return normalized.split(/^### /m).slice(1).map((part) => {
        const lines = part.split("\n");
        const card = { id: lines[0].trim() };
        let index = 1;
        while (index < lines.length && lines[index].startsWith("- ")) {
          const raw = lines[index].slice(2);
          const colon = raw.indexOf(":");
          if (colon !== -1) card[raw.slice(0, colon).trim()] = raw.slice(colon + 1).trim();
          index += 1;
        }
        if (lines[index] === "") index += 1;
        const body = lines.slice(index).join("\n").trim();
        const splitAt = body.indexOf("\n---\n");
        card.question = splitAt === -1 ? body : body.slice(0, splitAt).trim();
        card.answer = splitAt === -1 ? "" : body.slice(splitAt + 5).trim();
        return card;
      });
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        const cards = {};
        if (parsed.cards && typeof parsed.cards === "object") {
          for (const [key, value] of Object.entries(parsed.cards)) {
            if ((value === "known" || value === "review") && typeof key === "string" && key.length < 200) cards[key] = value;
          }
        }
        return { cards, theme: parsed.theme === "light" || parsed.theme === "dark" ? parsed.theme : "" };
      } catch {
        return { cards: {}, theme: "" };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards: state.cards, theme: state.theme }));
    }

    function cardKey(topicId, cardId) {
      return topicId + "/" + cardId;
    }

    function counts(topicId) {
      const cards = decks.get(topicId) || [];
      let known = 0;
      let review = 0;
      for (const card of cards) {
        const mark = state.cards[cardKey(topicId, card.id)];
        if (mark === "known") known += 1;
        if (mark === "review") review += 1;
      }
      return { total: cards.length, known, review };
    }

    function filteredCards() {
      const topic = catalog.find((item) => item.id === study.topicId);
      return (decks.get(study.topicId) || []).filter((card) => {
        if (study.version !== "All" && card.version !== study.version) return false;
        if (study.level !== "All" && card.level !== study.level) return false;
        const mark = state.cards[cardKey(study.topicId, card.id)];
        if (study.deck === "New" && mark) return false;
        if (study.deck === "Known" && mark !== "known") return false;
        if (study.deck === "Review" && mark !== "review") return false;
        return Boolean(topic);
      });
    }

    function rebuildQueue() {
      let ids = filteredCards().map((card) => card.id);
      if (study.shuffled) ids = shuffle(ids);
      study.ids = ids;
      study.cursor = 0;
      study.flipped = false;
    }

    function shuffle(list) {
      const copy = list.slice();
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        const hold = copy[index];
        copy[index] = copy[swap];
        copy[swap] = hold;
      }
      return copy;
    }

    function currentCard() {
      const id = study.ids[study.cursor];
      return (decks.get(study.topicId) || []).find((card) => card.id === id) || null;
    }

    function chip(label, pressed, action, arg) {
      return '<button type="button" aria-pressed="' + pressed + '" data-action="' + action + '" data-arg="' + escapeHtml(arg) + '">' + escapeHtml(label) + "</button>";
    }

    function renderHome() {
      const items = catalog.map((topic) => {
        const tally = counts(topic.id);
        return '<li><button class="topic" type="button" data-action="open" data-arg="' + escapeHtml(topic.id) + '"><strong>' +
          escapeHtml(topic.title) + "</strong><span>" + escapeHtml(topic.summary) + '</span><span class="meta">' +
          tally.total + " cards · " + tally.known + " known · " + tally.review + " to review</span></button></li>";
      }).join("");
      app.innerHTML = '<p class="meta">Suggested order. Pick a topic, then a version.</p><ul class="topic-list">' + items + "</ul>";
    }

    function renderStudy() {
      const topic = catalog.find((item) => item.id === study.topicId);
      const card = currentCard();
      const versions = ["All"].concat(topic.order);
      const levels = ["All", "beginner", "intermediate", "experienced"];
      const decksLabels = ["All", "New", "Review", "Known"];
      const tally = filteredCards();
      const known = tally.filter((item) => state.cards[cardKey(topic.id, item.id)] === "known").length;
      let body = '<p><a href="#/">All topics</a></p><h2>' + escapeHtml(topic.title) + "</h2>";
      body += '<div class="filters"><span>Version</span>' + versions.map((version) => chip(version, String(study.version === version), "version", version)).join("") + "</div>";
      body += '<div class="filters"><span>Level</span>' + levels.map((level) => chip(level, String(study.level === level), "level", level)).join("") + "</div>";
      body += '<div class="filters"><span>Deck</span>' + decksLabels.map((deck) => chip(deck, String(study.deck === deck), "deck", deck)).join("") + "</div>";
      body += '<p class="meta">' + known + " known of " + tally.length + " in this filter" + (study.ids.length ? " · card " + (study.cursor + 1) + " of " + study.ids.length : "") + "</p>";
      if (!card) {
        body += '<div class="empty"><p>No cards in this filter.</p></div>';
      } else {
        const mark = state.cards[cardKey(topic.id, card.id)];
        const face = study.flipped ? card.answer : card.question;
        const source = card.source && card.source.startsWith("https://")
          ? '<p><a href="' + escapeHtml(card.source) + '" target="_blank" rel="noopener noreferrer">Official source</a></p>'
          : "";
        body += '<div class="card" tabindex="0" role="button" aria-pressed="' + study.flipped + '" data-action="flip"><div class="badges">' +
          '<span class="badge">' + escapeHtml(card.version) + "</span>" +
          '<span class="badge">' + escapeHtml(card.level) + "</span>" +
          (mark ? '<span class="badge">' + escapeHtml(mark) + "</span>" : '<span class="badge">new</span>') +
          (card.status === "unverified" ? '<span class="badge warn">Unverified</span>' : "") +
          "</div><h2>" + escapeHtml(card.title) + "</h2>" + renderBlocks(face) + source + "</div>";
      }
      body += '<div class="actions">' +
        '<button type="button" data-action="prev">Previous</button>' +
        '<button type="button" data-action="flip">' + (study.flipped ? "Show question" : "Show answer") + "</button>" +
        '<button type="button" class="primary" data-action="known">Known</button>' +
        '<button type="button" data-action="review">Review</button>' +
        '<button type="button" data-action="next">Next</button>' +
        '<button type="button" data-action="shuffle">Shuffle</button>' +
        '<button type="button" data-action="reset">Reset topic</button>' +
        "</div><p class=\"keys\">Space flips. Arrow keys move. 1 marks known, 2 marks review.</p>";
      app.innerHTML = body;
    }

    function render() {
      const active = document.activeElement && document.activeElement.dataset
        ? document.activeElement.dataset.action
        : "";
      if (!study) renderHome();
      else renderStudy();
      if (!active) return;
      const next = app.querySelector('[data-action="' + CSS.escape(active) + '"]');
      if (next) next.focus();
    }

    function openTopic(topicId) {
      if (!decks.has(topicId)) return;
      study = { topicId, version: "All", level: "All", deck: "All", ids: [], cursor: 0, flipped: false, shuffled: false };
      location.hash = "#/" + topicId;
      rebuildQueue();
      render();
    }

    function markCurrent(status) {
      const card = currentCard();
      if (!card) return;
      state.cards[cardKey(study.topicId, card.id)] = status;
      saveState();
      const allowed = new Set(filteredCards().map((item) => item.id));
      const position = study.ids.indexOf(card.id);
      study.ids = study.ids.filter((id) => allowed.has(id));
      if (position === -1 || !study.ids.includes(card.id)) study.cursor = Math.min(position, Math.max(study.ids.length - 1, 0));
      else study.cursor = Math.min(position + 1, study.ids.length - 1);
      if (study.cursor < 0) study.cursor = 0;
      study.flipped = false;
      render();
    }

    function onClick(event) {
      if (event.target.closest("a")) return;
      const target = event.target.closest("[data-action]");
      if (!target || !app.contains(target)) return;
      const action = target.dataset.action;
      const arg = target.dataset.arg || "";
      if (action === "open") openTopic(arg);
      if (!study && action !== "open") return;
      if (action === "version" || action === "level" || action === "deck") {
        study[action] = arg;
        study.shuffled = false;
        rebuildQueue();
        render();
      }
      if (action === "flip") {
        study.flipped = !study.flipped;
        render();
      }
      if (action === "prev" && study.ids.length) {
        study.cursor = (study.cursor - 1 + study.ids.length) % study.ids.length;
        study.flipped = false;
        render();
      }
      if (action === "next" && study.ids.length) {
        study.cursor = (study.cursor + 1) % study.ids.length;
        study.flipped = false;
        render();
      }
      if (action === "known") markCurrent("known");
      if (action === "review") markCurrent("review");
      if (action === "shuffle") {
        study.shuffled = true;
        rebuildQueue();
        render();
      }
      if (action === "reset") {
        if (!window.confirm("Clear known and review marks for this topic?")) return;
        const prefix = study.topicId + "/";
        for (const key of Object.keys(state.cards)) if (key.startsWith(prefix)) delete state.cards[key];
        saveState();
        rebuildQueue();
        render();
      }
    }

    function applyHash() {
      const topicId = decodeURIComponent(location.hash.replace(/^#\//, ""));
      if (!topicId) {
        study = null;
        render();
        return;
      }
      if (decks.has(topicId) && (!study || study.topicId !== topicId)) openTopic(topicId);
    }

    document.querySelector("#home-link").addEventListener("click", (event) => {
      event.preventDefault();
      study = null;
      location.hash = "#/";
      render();
    });
    app.addEventListener("click", onClick);
    document.addEventListener("keydown", (event) => {
      if (!study) return;
      const typing = event.target.closest("input, textarea, a");
      if (event.key === " " && !event.target.closest("button, a, input, textarea")) {
        event.preventDefault();
        study.flipped = !study.flipped;
        render();
      }
      if (typing) return;
      if (event.key === "ArrowRight") { event.preventDefault(); app.querySelector('[data-action="next"]')?.click(); }
      if (event.key === "ArrowLeft") { event.preventDefault(); app.querySelector('[data-action="prev"]')?.click(); }
      if (event.key === "1") markCurrent("known");
      if (event.key === "2") markCurrent("review");
    });

    document.querySelector("#theme").addEventListener("click", () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark" ||
        (!document.documentElement.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
      state.theme = dark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", state.theme);
      saveState();
    });
    document.querySelector("#export").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ cards: state.cards }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "interview-progress.json";
      link.click();
      URL.revokeObjectURL(url);
    });
    document.querySelector("#import").addEventListener("click", () => document.querySelector("#import-file").click());
    document.querySelector("#import-file").addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (!parsed.cards || typeof parsed.cards !== "object" || Array.isArray(parsed.cards)) throw new Error("missing cards");
        const next = {};
        for (const [key, value] of Object.entries(parsed.cards)) {
          if ((value === "known" || value === "review") && typeof key === "string" && key.length < 200) next[key] = value;
        }
        if (!window.confirm("Replace progress in this browser with " + Object.keys(next).length + " marks from the file?")) return;
        state.cards = next;
        saveState();
        if (study) rebuildQueue();
        render();
      } catch {
        window.alert("That file is not a progress export.");
      }
    });
    window.addEventListener("hashchange", applyHash);

    async function boot() {
      if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
      try {
        const response = await fetch("content/index.json");
        if (!response.ok) throw new Error("index");
        const index = await response.json();
        catalog = index.topics;
        await Promise.all(catalog.map(async (topic) => {
          const file = await fetch(topic.file);
          if (!file.ok) throw new Error(topic.file);
          decks.set(topic.id, parseCards(await file.text()));
        }));
        applyHash();
      } catch {
        app.innerHTML = '<div class="banner"><p>The cards could not be loaded. Browsers block this page when it is opened as a file.</p><p>From the project folder, run <code>python -m http.server 8000</code> and open <code>http://localhost:8000</code>.</p></div>';
      }
    }

    boot();
  </script>
</body>
</html>
